<!DOCTYPE html>
<html>
<head>
    <title>Secure App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<h2>Register</h2>
<form method="POST" action="/register">
    <input type="hidden" name="_csrf" id="csrfTokenRegister">

    <input type="text" name="username" placeholder="Username" required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit">Register</button>
</form>

<h2>Login</h2>
<form method="POST" action="/login">
    <input type="hidden" name="_csrf" id="csrfTokenLogin">

    <input type="text" name="username" placeholder="Username" required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit">Login</button>
</form>

</div>

<script>
fetch('/csrf-token')
  .then(res => res.json())
  .then(data => {
    document.getElementById('csrfTokenRegister').value = data.csrfToken;
    document.getElementById('csrfTokenLogin').value = data.csrfToken;
  })
  .catch(err => console.error("CSRF error:", err));
</script>

</body>
</html>
